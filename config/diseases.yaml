# Entity dictionary §30 — disease variants, SENASICA, symptoms, species

diseases:
  gusano_barrenador:
    label: "Gusano barrenador del ganado"
    canonical_id: gusano_barrenador
    variants:
      - gusano barrenador
      - gusano barrenador del ganado
      - GBG
      - Cochliomyia hominivorax
      - Cochliomyia
      - screwworm
      - new world screwworm
      - NWS
      - miasis
      - myiasis
      - barrenador
    species_affected:
      - bovino
      - ganado bovino
      - vacuno
      - ovino
      - caprino
      - porcino
      - equino
    exclude:
      - africana
      - peste porcina africana

  gripe_aviar:
    label: "Gripe aviar / Influenza aviar"
    canonical_id: gripe_aviar
    variants:
      - gripe aviar
      - influenza aviar
      - bird flu
      - avian influenza
      - H5N1
      - H5N6
      - H7N9
      - HPAI
      - LPAI
      - virus aviar
    species_affected:
      - aves
      - gallináceas
      - patos
      - aves de corral
      - pollos
      - pavos
      - aves silvestres
    exclude:
      - gripe porcina
      - influenza humana

  fiebre_porcina_clasica:
    label: "Peste porcina clásica"
    canonical_id: fiebre_porcina_clasica
    variants:
      - peste porcina clásica
      - peste porcina clasica
      - classical swine fever
      - hog cholera
      - cólera porcino
      - CSF
      - PPC
      # legacy synonym — Spanish press mislabel
      - fiebre porcina clásica
      - fiebre porcina clasica
    species_affected:
      - cerdo
      - porcino
      - cerdos
      - lechones
    exclude:
      - africana
      - african swine fever
      - ASF
      - ASFV
      - PSA
      - PPA
      - peste porcina africana

