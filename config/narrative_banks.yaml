structures:
  - id: autoridad_ocultamiento_brote
    label: autoridad + ocultamiento + brote
    need: [autoridades, ocultamiento, salud_animal]
  - id: gobierno_mentira_enfermedad
    label: gobierno + mentira + enfermedad
    need: [autoridades, falsedad, enfermedad]
  - id: casos_oficial_fuera_contexto
    label: casos + información oficial + fuera de contexto
    need: [salud_animal, reporte, contexto]
  - id: evento_intencion
    label: evento real + afirmación de intención
    need: [salud_animal, acusaciones]
  - id: brote_amenaza_panico
    label: brote + amenaza + pánico
    need: [salud_animal, alarmismo]
  - id: autoridad_no_reportar_casos
    label: autoridad + no reportar + casos
    need: [autoridades, reporte, salud_animal]
    require_any: [no reportar, no informar, ocult]

narratives:
  - id: NAR-ocultamiento
    label: Acusación de ocultamiento
    description: Relato que atribuye a autoridades la omisión o encubrimiento de un evento sanitario.
    categories: [ocultamiento, acusaciones]
  - id: NAR-alarmismo
    label: Alarmismo sanitario
    description: Relato que escala un evento a crisis, catástrofe o pánico.
    categories: [alarmismo]
  - id: NAR-brote
    label: Descripción de brote
    description: Relato centrado en casos, focos o transmisión, sin acusación de intención.
    categories: [salud_animal, enfermedad]
    extra_terms: [brote, outbreak, foco, foco sanitario, casos confirmados]
  - id: NAR-contexto
    label: Información fuera de contexto
    description: Datos reales usados de forma incompleta o recortada.
    categories: [contexto]
  - id: NAR-intencion
    label: Intención no demostrada
    description: De un hecho reportado se deriva una intención (ocultar, mentir) sin evidencia.
    categories: [certeza, acusaciones, ocultamiento]
  - id: NAR-vacunas
    label: Vacunas y control
    description: Relato que vincula vacunación, erradicación o control sanitario con acusaciones.
    categories: [conspiracion]
    extra_terms: [vacuna, vacunación, vaccine, erradicación]
  - id: NAR-artificial
    label: Origen artificial
    description: Relato que atribuye la enfermedad a laboratorio o diseño.
    extra_terms: [artificial, laboratorio, creada, bioweapon, arma biol]
